# Render Blueprint: hossouko-installer, the SaaS admin screen, as a free static site.
#
# The API must list this site's URL in its CORS_ORIGINS, and the build must
# know the API: set VITE_HOSSOUKO_API_BASE below. Sign-in is phone + SMS code
# for numbers with the admin role (hossouko-BE app/api/auth.py).

services:
  - type: web
    runtime: static
    name: hossouko-installer
    buildCommand: npm ci && npm run lint && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: VITE_HOSSOUKO_API_BASE
        sync: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Content-Security-Policy
        # connect-src/img-src/media-src must allow the API and the media host
        # (R2). Tighten `https:` to those two origins once they are known.
        value: "default-src 'self'; connect-src 'self' https: http://localhost:8000; img-src 'self' https: data: http://localhost:8000; media-src https:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
